configure_dotfiles: false
configure_sudoers: false
configure_terminal: false
configure_osx: false
configure_dock: true

dockitems_remove:
  - Launchpad
  - Mail
  - Safari
  - Contacts
  - Notes
  - Reminders
  - Maps
  - Photos
  - Messages
  - FaceTime
  - iTunes
  - iBooks
  - App Store
  - "System Preferences"
  - Calendar
  - TV
  - Podcasts
  - Music
  - News

dockitems_persist:
  - name: Brave Browser
    path: "/Applications/Brave Browser.app"
    pos: 1
  - name: Bitwarden
    path: "/Applications/Bitwarden.app"
    pos: 2
  - name: massCode
    path: "/Applications/massCode.app"
    pos: 3
  - name: Spotify
    path: "/Applications/Spotify.app"
    pos: 4

homebrew_installed_packages:
  - antidote
  - bat
  - chezmoi
  - fzf
  - gh
  - git-delta
  - lua-language-server
  - luacheck
  - mise
  - neovim
  - knqyf263/pet/pet
  - pipx
  - pre-commit
  - lemoony/tap/snipkit
  - wget
  - yamllint
  - zoxide

homebrew_cask_apps:
  - bitwarden
  - brave-browser
  - discord
  - google-chrome
  - gramps
  - iterm2
  - kodi
  - masscode
  - moonlight
  - nordvpn
  - philips-hue-sync
  - signal
  - sonos
  - spotify
  - steam
  - teamviewer
  - the-unarchiver
  - vlc

