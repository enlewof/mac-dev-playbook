configure_dotfiles: true
configure_sudoers: false
configure_terminal: false
configure_osx: false
configure_dock: false

dockitems_remove:
  - Launchpad
  - Mail
  - Safari
  - Contacts
  - Notes
  - Reminders
  - Maps
  - Photos
  - Messages
  - FaceTime
  - iTunes
  - iBooks
  - App Store
  - "System Preferences"
  - Calendar
  - TV
  - Podcasts
  - Music
  - News

dockitems_persist:
  - name: Brave Browser
    path: "/Applications/Brave Browser.app"
    pos: 1
  - name: Bitwarden
    path: "/Applications/Bitwarden.app"
    pos: 2
  - name: massCode
    path: "/Applications/massCode.app"
    pos: 3
  - name: Spotify
    path: "/Applications/Spotify.app"
    pos: 4

dotfiles_repo: git@github.com:enlewof/dotfiles.git
dotfiles_repo_accept_hostkey: yes
dotfiles_repo_local_destination: ~/Documents/code/dotfiles
dotfiles_files:
  - .aliases
  - .gitconfig
  - .git-template/hooks/pre-commit
  - .p10k.zsh
  - .vim/autoload/plug.vim
  - .vimrc
  - .zshrc

homebrew_installed_packages:
  - antigen
  - pre-commit
  - wget

homebrew_cask_apps:
  - bitwarden
  - brave-browser
  - discord
  - google-chrome
  - gramps
  - iterm2
  - kodi
  - masscode
  - moonlight
  - nordvpn
  - spotify
  - steam
  - teamviewer
  - the-unarchiver
  - vlc

pip_packages:
  - name: pynvim
    executable: pip3
